name: NEXUS offline verification
on:
  pull_request:
  push:
    branches: ['arena/**']
permissions:
  contents: read
concurrency:
  group: nexus-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: nexus-test-only
          POSTGRES_DB: nexus_quota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_quota_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm --prefix server ci --ignore-scripts
      - run: npm test
      - name: Real PostgreSQL quota concurrency and failure tests
        env:
          NEXUS_TEST_POSTGRES_URL: postgresql://nexus_test:nexus-test-only@127.0.0.1:5432/nexus_quota_test
        run: npm run test:postgres
      - run: git diff --check
