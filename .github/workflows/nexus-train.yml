name: NEXUS shadow training
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-production-jobs
  cancel-in-progress: false
jobs:
  train:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.NEXUS_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline trainer regression tests
        run: python3 -m unittest discover -s trainer -p 'test_*.py'
      - name: Train validated shadow candidate (never promote)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if python3 trainer/train.py run; then
            echo 'Shadow training completed; no active model promotion. See simulated metrics in the step log.' >> "$GITHUB_STEP_SUMMARY"
          else
            code=$?
            echo 'Shadow training failed; active model unchanged. Inspect dataset eligibility, storage and registry checks.' >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
