name: Deploy NEXUS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Prepare public site
        run: |
          mkdir -p public/assets/fonts
          cp index.html public/index.html
          # Self-hosted font + its OFL license ship with the site.
          cp assets/fonts/inter-latin-wght-normal.woff2 public/assets/fonts/
          cp assets/fonts/INTER-OFL-LICENSE.txt public/assets/fonts/
      - name: Credential guard (no keys.js, no embedded keys/tokens)
        run: node tools/check-public.cjs public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
