name: Deploy NEXUS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix server ci --ignore-scripts
      - run: npm test
      - name: Prepare public site
        run: |
          mkdir -p public/assets/fonts
          cp index.html public/index.html
          # Self-hosted fonts + their OFL licenses ship with the site.
          cp assets/fonts/inter-latin-wght-normal.woff2 public/assets/fonts/
          cp assets/fonts/INTER-OFL-LICENSE.txt public/assets/fonts/
          cp assets/fonts/cinzel-latin-400-normal.woff2 public/assets/fonts/
          cp assets/fonts/cinzel-latin-600-normal.woff2 public/assets/fonts/
          cp assets/fonts/CINZEL-OFL-LICENSE.txt public/assets/fonts/
      - name: Credential guard (no keys.js, no embedded keys/tokens)
        run: node tools/check-public.cjs public
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
